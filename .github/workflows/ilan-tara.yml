name: ilan-tara

on:
  schedule:
    - cron: "17 */3 * * *"   # her 3 saatte bir
  workflow_dispatch:
    inputs:
      sifirla:
        description: "Görülen ilanları unut ve baştan tara"
        type: boolean
        default: false
  push:
    paths:
      - "ilan-takip/scraper/**"
      - ".github/workflows/ilan-tara.yml"

permissions:
  contents: write   # data/ilanlar.json'u depoya yazmak için
  actions: write    # 2 yıllık süre bitince bu akışı kapatmak için

concurrency:
  group: ilan-tara
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DAL: ${{ github.ref_name }}
      VARSAYILAN_DAL: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Testler
        run: python3 -m unittest discover -s ilan-takip/scraper

      - name: Tara
        id: tara
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PROFIL_JSON: ${{ secrets.PROFIL_JSON }}
          SIFIRLA: ${{ inputs.sifirla }}
        run: |
          args=""
          # Yalnızca varsayılan dalda veri yazılır ve bildirim gönderilir; diğer dallar kuru çalışır.
          if [ "$DAL" != "$VARSAYILAN_DAL" ]; then args="--kuru"; fi
          if [ "$SIFIRLA" = "true" ]; then args="$args --sifirla"; fi
          python3 ilan-takip/scraper/tara.py $args

      - name: Sonuçları depoya kaydet
        if: github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name "ilan-takip-bot"
          git config user.email "ilan-takip-bot@users.noreply.github.com"
          git add ilan-takip/data
          if git diff --cached --quiet; then echo "Değişiklik yok."; exit 0; fi
          git commit -m "ilan-takip: tarama sonuçları"
          for deneme in 1 2 3; do
            git push origin "HEAD:$DAL" && exit 0
            git pull --rebase origin "$DAL"
          done
          exit 1

      - name: Takip süresi bitti, zamanlayıcıyı kapat
        if: steps.tara.outputs.bitti == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable ilan-tara.yml
